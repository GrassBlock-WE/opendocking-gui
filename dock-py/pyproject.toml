[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
# Two console scripts, deliberately: `odgui` opens the viewer, `odcli` runs the
# full command-line interface. Nothing else is installed, and neither command
# depends on the other existing.
name = "opendocking"
version = "0.1.0"
description = "Open Docking: a modern, open-source molecular docking engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Open Docking Contributors" }]
keywords = ["docking", "molecular-dynamics", "cheminformatics", "autodock", "vina"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.22",
    "rdkit>=2022.9",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.4", "moderngl>=5.8", "numpy-stl>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
# Exactly two commands, and they are deliberately different things:
#   odgui   the 3-D workbench; bare `odgui` opens it
#   odcli   the full command-line interface (prep / grid / dock / info)
# Adding a third alias would only give users a second name to get wrong.
odgui = "opendocking.workbench.launcher:main"
odcli = "opendocking.cli:main"

[project.urls]
Homepage = "https://github.com/GrassBlock-WE/opendocking-gui"
Repository = "https://github.com/GrassBlock-WE/opendocking-gui"
Issues = "https://github.com/GrassBlock-WE/opendocking-gui/issues"

[tool.maturin]
# The Python package lives beside the Rust extension rather than inside it,
# which is what maturin's `python-source` expects.
python-source = "python"
module-name = "opendocking._dockpy"
features = ["pyo3/extension-module"]
strip = true
# Byte-code caches are build output, not source. Shipping them bloats the wheel
# and risks a stale .pyc shadowing an edited module.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]
