[pytest]
# The test suite ships *inside* the installed package, so run it against the
# installed wheel rather than this source tree (the source tree has no compiled
# `_dockpy` extension next to it):
#
#     python -m pytest --pyargs opendocking -q
#
# `testpaths` below only applies when you run pytest from this directory after a
# `maturin develop` install, which puts `_dockpy*.pyd` next to the sources.
testpaths = opendocking/tests
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:rdkit.*
