# The gate a pull request has to pass. Every command below was run locally on
# Windows 11 / rustc 1.98.1 / Python 3.10 before it was written here; see
# docs/VERIFICATION.md.
#
# Three jobs, each named after what it actually verifies, because a job whose
# name promises more than it pins is how a suite goes dark without anybody
# noticing:
#
#   engine / bindings  -- the Rust crate, the built wheel, the two console
#                         scripts, and `odgui --check`'s answer on a job that
#                         deliberately installed no GUI extras.
#   python check suite -- the audit scripts under `scripts/`. No display is
#                         used and none is needed.
#   workbench          -- everything that needs a real Qt OpenGL widget.
#
# **What this file used to get wrong**, measured on runs 36823282397 and
# 36838365790: every audit script lived in the workbench job, behind the GUI
# stack step. That step runs `odgui --check`, which on this runner answers
# exit 5 -- OpenGL is fine, Qt cannot realise an OpenGL widget -- and the
# `case` statement here knew only 0 and 4, so the step failed. A failing step
# skips every step after it, so **13 audit steps were cancelled as collateral,
# on two consecutive runs**: the entire Python audit suite did not execute on
# CI at all. The run still reported success, because the job carried
# `continue-on-error: true`, which is the one setting that turns "nothing was
# checked" into "everything is fine".
#
# Hence four changes, each of which removes a way for a suite to be dark:
#
#   1. The audit scripts live in a job that needs no display and no widget, so
#      no GUI capability can take them down with it.
#   2. The workbench job no longer carries `continue-on-error`, so a failure
#      inside it is visible on the run instead of being absorbed.
#   3. The widget probe became a *capability report* that publishes what this
#      runner can do, and the steps that genuinely need a widget are gated on
#      that measurement. A step is now skipped because a measured fact says it
#      cannot run here, never because an earlier step happened to fail, and the
#      report step runs either way and says so out loud.
#   4. Every audit step carries `if: !cancelled() && <the build succeeded>`.
#      Change 1 moved the audits out of a job that could cancel them; it did
#      not stop one failing audit from cancelling the next ten, and run
#      36841406330 showed exactly that -- `core_check.py` died on its own
#      import line and the ten steps behind it never ran. The default
#      `success()` is what makes a step conditional on *all* its predecessors,
#      which for a suite of independent checks is the wrong condition. These
#      steps do not depend on each other, so they are conditioned only on the
#      one thing they genuinely need (a built wheel) and on the run not having
#      been cancelled. A failing step still fails the job -- `if` decides
#      whether a step runs, never whether its failure counts.
#
# The header used to claim the runner "does have a working OpenGL context under
# xvfb-run". It does not, and the claim was load-bearing: it is why the audit
# scripts were considered safe to hide behind a GUI step. The raw context works
# (Mesa software rasteriser, GL 4.5); the Qt widget probe aborts inside
# `show()`. Both facts are now reported separately, which is what the launcher's
# exit code 5 exists to say.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep the engine byte-reproducible across runners.
  RUSTFLAGS: "-C target-cpu=x86-64"

jobs:
  core:
    name: engine / bindings (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            cargo: ""
          - features: gpu
            cargo: "--features gpu"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dock-py/pyproject.toml') }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libegl1

      - name: Unit tests
        run: cargo test --workspace --locked ${{ matrix.cargo }}

      # Zero tolerance, in both feature configurations. The matrix already
      # covers that; a separate job would just duplicate it.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.cargo }} -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked -m dock-py/Cargo.toml --out dist ${{ matrix.cargo }}
          python -m pip install --force-reinstall dist/opendocking-*.whl

      # `--pyargs` runs the *installed* package, which is the point: it is the
      # artifact a user gets. Editing Python sources without rebuilding the
      # wheel tests the old code -- that mistake was made once already.
      - name: Python tests against the installed wheel
        run: |
          python -m pip install pytest
          python -m pytest --pyargs opendocking.tests -q

      # The step is called "entry points resolve", so that is the only thing it
      # asserts. `odgui --check` used to be a bare fourth line here, which made
      # the step unfalsifiable: this job deliberately installs no GUI extras, so
      # the check correctly answered 3 ("PyQt6 could not be imported"), and
      # `set -e` read that documented answer as a packaging failure.
      #
      # It now pins the answer this job is *supposed* to give, which is a
      # stronger claim than "did not crash": if the GUI extras ever become hard
      # dependencies, or 3 ever stops meaning "no PyQt6", this step goes red
      # and says which of the two moved.
      - name: Entry points resolve
        run: |
          odcli --version
          odcli info
          odgui --help
          set +e
          verdict=$(odgui --check --json)
          rc=$?
          set -e
          echo "$verdict"
          if [ "$rc" -ne 3 ]; then
            echo "::error::odgui --check --json exited ${rc}; this job installs no PyQt6, so 3 (no GUI stack) is the only correct answer here"
            exit 1
          fi
          # The payload and the process have to agree, not merely both exist. A
          # report that says one thing and exits with another is precisely the
          # failure this command was rewritten to stop making, so the agreement
          # is asserted here rather than assumed. The mapping is the whole
          # documented vocabulary, and it is asserted as a set so a new verdict
          # cannot be added without this line being updated with it.
          echo "$verdict" | python -c "
          import json, sys
          d = json.load(sys.stdin)
          want = {'ok': 0, 'no-gui-stack': 3, 'no-context': 4, 'no-widget': 5}
          assert d['exit'] == 3, d
          assert want[d['verdict']] == d['exit'], d
          print('payload and process agree:', d['verdict'], d['exit'])
          "
          echo "odgui --check answered 3, as it must on a job with no GUI extras"

      # The package ships exactly two commands: one for the viewer, one for the
      # CLI. A third entry would be a packaging mistake worth catching here.
      - name: Exactly the two documented console scripts are installed
        run: |
          actual=$(python -c "import importlib.metadata as m; print(','.join(sorted(e.name for e in m.entry_points(group='console_scripts') if 'opendocking' in (e.value or ''))))")
          echo "installed: ${actual}"
          if [ "${actual}" != "odcli,odgui" ]; then
            echo "::error::expected 'odcli,odgui' but got: ${actual}"
            exit 1
          fi

  checks:
    name: python check suite (no display)
    runs-on: ubuntu-latest
    # The audit scripts are the project's real gate: 22 of them, each pinning a
    # count. They used to run as steps of the workbench job, which is how a
    # runner without a Qt OpenGL widget took all of them down with it. This job
    # has no `continue-on-error` and no display, so "the GUI is unhappy here" is
    # not something it can express.
    #
    # The `if:` on every audit step below is the same line, and it is load
    # bearing. These checks are independent of one another, so conditioning them
    # on all of their predecessors succeeding -- which is what an unadorned step
    # does -- means one failure hides every check behind it. That is not a
    # hypothetical: on run 36841406330 `core_check.py` died on its own import
    # line and the ten steps behind it never executed, which is the same shape
    # of failure as the one this job was created to end, one level down.
    #
    # `!cancelled() && steps.wheel.outcome == 'success'` says exactly two
    # things: the run was not cancelled, and there is a wheel to audit. It does
    # not say "nothing before me failed", and it does not suppress a failure --
    # a step that runs and fails still fails the job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dock-py/pyproject.toml') }}

      - name: Build and install the wheel
        id: wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked -m dock-py/Cargo.toml --out dist
          python -m pip install --force-reinstall dist/opendocking-*.whl

      # Installing the GUI extras here is not for a display -- there is none, and
      # nothing below opens a window. It is so the scripts import exactly what
      # they import on a maintainer's machine: `core_check.py` walks the
      # workbench wrappers on a real instance, and a suite that silently skips
      # the half of the API that needs PyQt6 is a suite measuring less than it
      # appears to.
      #
      # rdkit and meeko are third-party oracles. rdkit is the only comparison in
      # the bond check against a bond perception written by somebody else; meeko
      # is the tool that produced the shipped `examples/*.pdbqt` and parses by
      # column, so it refuses a line this project's own whitespace-based reader
      # would accept. A check only the maintainer can run is a note, not a gate.
      #
      # Two facts, both measured on a runner, make the pinning load bearing
      # rather than tidy:
      #
      #   * The runner image ships its own `rdkit` 2026.3.6, `numpy` 2.4.6 and
      #     `Pillow`, and pip reports them as "already satisfied". So without a
      #     pin, the oracle this gate compares against is whatever the image
      #     happened to contain on the day. This project already holds that an
      #     oracle's *absence* must fail the build rather than silently reduce
      #     what is checked; an oracle *present by accident*, at an unpinned
      #     version, is the same hole from the other side.
      #   * meeko's wheel metadata declares **no** requirements at all, while
      #     `meeko/__init__.py` imports `prody` at module level (and `gemmi`,
      #     `scipy` and `pandas` from its submodules). pip therefore installed
      #     nothing on its behalf, and `import meeko` died on the runner with a
      #     bare ModuleNotFoundError while the step that "installed the oracles"
      #     was green. The maintainer's machine has all seven of those packages,
      #     which is exactly how a check passes locally and cannot run in CI.
      #
      # meeko is pinned to the version this project has actually validated
      # against -- 0.7.1, the one the maintainer's checks compare against. An
      # earlier draft pinned 0.8.0 on the reasoning that it is what the runner
      # resolved to, which is the wrong reason: a pin is a claim that a known
      # version works, and pinning the version that happened to appear first
      # would make the oracle's identity a function of the day. The rest are
      # named because meeko imports them at module level whether or not its
      # metadata says so.
      - name: Install the extras the oracles need
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          python -m pip install "PyQt6>=6.4" "moderngl>=5.8" "meeko==0.7.1" \
            "rdkit>=2024.3.1" prody gemmi scipy pandas

      # Prints what was actually resolved, and fails if any oracle is missing.
      # The failure has to be here rather than inside a check script: a script
      # that discovers its own oracle is absent can only report it, and a report
      # is not a gate. This step makes "the oracles ran" a fact about the run
      # rather than a claim in a log nobody reads.
      - name: The third-party oracles are importable, and here are their versions
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          python -c "
          import importlib
          import importlib.metadata as m
          for mod, dist in (('rdkit','rdkit'), ('meeko','meeko'), ('prody','prody'),
                            ('gemmi','gemmi'), ('scipy','scipy')):
              importlib.import_module(mod)
              print('  {0:<8} {1}'.format(mod, m.version(dist)))
          print('every declared oracle is importable, at the versions above')
          "

      # The meta-checks go first, and on purpose: `check_scripts_declare.py`
      # audits every other script's declared count, and `docs_claims_check.py`
      # scores the prose against the code. Running them last would mean a
      # failure in a suite is reported without knowing whether the suite's own
      # bookkeeping is the thing that broke.
      - name: The audit scripts' own bookkeeping and the documents
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          python scripts/check_scripts_declare.py
          python scripts/docs_claims_check.py

      - name: Engine binding surface
        # 38 pytest cases covered this module, and between them they missed a
        # public property that raised AttributeError on every single call: its
        # helper was named with two leading underscores, so calling it from a
        # second class mangled it to a name that did not exist. Both pytest
        # meta-tests look at this module from outside -- one checks that wrapper
        # attributes are names the Rust extension exports, the other uses
        # hasattr and only over DockingResult -- and the defect lived in the seam
        # between two Python classes, where neither can see.
        # This one walks every public member of every wrapper on a real
        # instance and reverse-asserts that none was left unchecked.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python scripts/core_check.py

      - name: Pose/receptor interaction criteria
        # No display needed, and it has to be a gate rather than a note: the
        # hydrogen-bond thresholds were once accepted as arguments and then
        # ignored, and nothing noticed until a check loosened one criterion at a
        # time and the answers did not change.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          python scripts/contacts_check.py
          python scripts/contacts_check2.py

      - name: Scoring agrees across the two surfaces
        # The same pose, scored through the Python wrapper and through the Rust
        # binding, must give the same number. It is the only check that can
        # notice one of the two quietly changing units.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python scripts/scoring_cross_check.py

      - name: Pocket search geometry and thresholds
        # Also a gate, for the same reason. The volume ceiling and the burial
        # threshold are what stop the list reporting a protein's entire outer
        # surface as one 3564 A^3 "site", and a check that only looked at the
        # crambin result would have passed with both of them removed.
        #
        # This one docks as well as searches, so it needs the engine rather
        # than just numpy.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python scripts/pockets_check.py

      - name: Bond perception and representation geometry
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          python scripts/structure_bond_check.py
          python scripts/representation_geometry_check.py

      - name: Preparation reports what it dropped
        # Also a gate, and it needs no display. `prepare_receptor` keeps one
        # component of its input and discards the rest, which is usually right,
        # but until now the only record was a RuntimeWarning -- and a warning is
        # a string that GUI code and CLI code routinely drop on the floor. On
        # 1HVR, a homodimer, the redocking benchmark searched a two-chain
        # 1826-atom structure while docking against a 621-atom single chain, and
        # every RMSD it produced was meaningless. This script pins the report,
        # pins that the warning is generated *from* the report so the two cannot
        # disagree, and pins the `prepare_receptor() -> str` contract.
        #
        # `prepare_ligand` had no check at all while `prepare_receptor` had one,
        # and it is the path a first run actually goes through. It also covers
        # the two dead-and-broken paths this found: a water/ion filter that
        # called RemoveAtom on a Chem.Mol (which has no such method, so it had
        # never removed anything), and a PathToSubmol call that takes a
        # traversal path rather than a set of atoms.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          python scripts/prep_check.py
          python scripts/ligand_check.py

      - name: The eight odcli subcommands
        # `odcli` has eight subcommands and until now exactly one had been
        # run. Exit codes are taken from the code, not guessed -- two are
        # unintuitive: `dock` returns 2 for an empty ligand directory, and
        # `workbench` returns 3 for a missing GUI stack. Every one of the
        # eleven failure paths asserts that the diagnostic is present *and*
        # that no Python traceback is.
        # A coverage guard compares the subcommand table from `odcli --help`
        # against the set this script actually ran, demanding set equality, so
        # adding a command without a section fails the build.
        # `cli_prep_check.py` runs the installed console script, not an import,
        # because exit codes and argument parsing are exactly what a CLI gets
        # wrong -- and it is the check that catches a source tree and an
        # installed wheel having drifted apart.
        # ~21 s over 36 subprocesses; the engine time is 0.26-0.40 s per
        # docking run and the rest is interpreter cold start.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          python scripts/cli_check.py
          python scripts/cli_prep_check.py

      - name: The diagnostics in examples/
        # Five scripts that were not in CI, not in the reproduce list, and not
        # covered by any other check -- which makes them the only diagnostics
        # this project has, and a diagnostic nobody runs rots against a system
        # that has since changed. `diagnose_clash.py` in particular was written
        # to investigate a scoring function that no longer exists.
        # Judged on what each one *printed*, not on its exit code: a script
        # whose checks quietly stopped running still exits zero.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python scripts/examples_check.py

      - name: PDBQT file format
        # A round trip through this project's own writer and reader only proves
        # they agree, and they can share a bug: `read_pdbqt_models` is a
        # MODEL/ENDMDL splitter that never reads a column, and the Rust
        # `Ligand.from_pdbqt` is whitespace-based, so it accepts a line with a
        # space deleted at column 31. Meeko parses by column and refuses that.
        # The three claims -- third-party parser, shipped third-party files,
        # own readers -- are asserted separately on purpose.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python scripts/pdbqt_check.py

      - name: X11 window lookup parses each tool's real output
        # No display needed: this stubs the helpers with the formats they
        # really print. It guards the workbench job's launch step, which needs
        # a window and is therefore conditional on a measured capability.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python scripts/x11_window_parse_check.py

      - name: What the benchmarks report
        # pocket_benchmark.py and redock_benchmark.py are not gates and never
        # will be -- a corpus result has no ground truth, and gating it would be
        # asserting the internet. What *is* gateable is that every number each
        # one prints is the number its own line says it is, which is exactly
        # what was wrong: the pocket benchmark's "cost per 1000 atoms" was
        # milliseconds per *atom*, so a 17.6 s search over 4779 atoms printed
        # "4HHB 4 ms".
        # Offline in about a second: `urlopen` is stubbed, so no case may touch
        # the network. Deliberately gates no corpus number, and says so.
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: python scripts/benchmark_check.py

  docs:
    name: documentation hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Chinese documents are UTF-8. PowerShell 5.1 reads them as GBK and
      # silently destroys them, so their integrity is checked on every push.
      - name: Document encoding
        run: python scripts/check_doc_encoding.py

      - name: Links and local-path leakage
        run: python scripts/check_repo_docs.py

      - name: Citation metadata parses
        run: |
          python -m pip install pyyaml cffconvert
          cffconvert --validate

  gui:
    name: workbench (needs a real OpenGL widget)
    runs-on: ubuntu-latest
    # No `continue-on-error` here any more. It was the setting that let a failing
    # step inside this job vanish behind a green tick on the run, and it is how
    # thirteen audit steps came to be skipped without anybody deciding to skip
    # them. What replaces it is not a softer verdict: it is a capability report
    # at the top of the job, so the steps that cannot run on a headless runner
    # are skipped for a stated, measured reason instead of a collateral one, and
    # everything else fails loudly.
    #
    # The `if:` on the suites below has the same purpose as the ones in the
    # `checks` job: they are independent, so none of them should be able to
    # cancel another. `workbench_interaction_check.py` failing must not hide the
    # framing measurement or the renderer smoke test, which is exactly what
    # happened to ten audit scripts one job over.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        run: |
          sudo apt-get update
          # What the engine, the CLI and the headless GUI check need. These
          # have to be present: if one goes missing the job is reporting a
          # real environment problem.
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0 libegl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0
          # Qt 6.5 and later refuse to load the xcb platform plugin without
          # libxcb-cursor0, and say so in the log. It lives in universe, which
          # a runner image is not guaranteed to have enabled, so this group is
          # best-effort: if it is unavailable the job still runs every step
          # that does not need a real window, instead of failing on the apt
          # line before any of them execute.
          #
          # xdotool is here because the launch check needs it to *find* the
          # window: xvfb-run starts a display with no window manager, and
          # wmctrl asks the window manager for the client list, so with no WM
          # it can find nothing. xdotool walks the X tree with XQueryTree and
          # needs no WM. x11-utils gives xwininfo, the last-resort "the window
          # is there" probe.
          #
          # openbox is here because closing the window the way a person does
          # needs a window manager: wmctrl -c routes the close request through
          # one, and xdotool windowclose is not a substitute -- it destroys the
          # X window without Qt ever seeing a close event, which leaves the
          # process running with nothing on screen. A real desktop has a WM;
          # this runner did not, which is why the step kept failing.
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-xinerama0 wmctrl xdotool x11-utils openbox || \
            echo "::warning::Qt xcb extras unavailable; the windowed checks will be skipped"

      # Only the two GUI extras, deliberately. This job's steps are the
      # workbench layout, interaction, framing, renderer smoke, screenshots and
      # the real launch -- none of which parses a PDBQT with a third-party
      # library, so rdkit and meeko are not installed here. They were, once,
      # because the audit scripts used to live in this job; leaving them would
      # mean two jobs disagree about which oracles exist, and an oracle that is
      # installed in one job and absent in the other makes a check's behaviour
      # depend on where it runs. The `checks` job owns the oracles and pins them.
      - name: Build and install the wheel with GUI extras
        id: wheelgui
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked -m dock-py/Cargo.toml --out dist
          python -m pip install --force-reinstall dist/opendocking-*.whl
          python -m pip install "PyQt6>=6.4" "moderngl>=5.8"

      # A static audit, so it needs no display and runs first: it is the check
      # that keeps the *other* GUI scripts honest. Five of them used to carry
      # their own copy of the same `odgui --check` wrapper, all parsing the first
      # line of prose as the reason -- which on a successful check is the banner,
      # not a reason. They now share one implementation that reads
      # `odgui --check --json`, and this step is what notices if a sixth copy
      # appears. Without it the convergence is a convention rather than a fact,
      # and conventions are what drift.
      - name: GUI scripts share one odgui --check wrapper
        if: ${{ !cancelled() && steps.wheelgui.outcome == 'success' }}
        run: python scripts/_gui_check.py

      # The capability report. It walks a ladder of Qt/OpenGL routes until one
      # of them can realise an actual OpenGL widget, and publishes what this
      # runner can do as step outputs. Three properties make it a gate rather
      # than a convenience:
      #
      #   * It asserts the exit-code *vocabulary*, not a capability. 0 means the
      #     widget worked, 4 means there is no OpenGL at all, 5 means OpenGL
      #     exists and Qt cannot put it in a widget, and 3 -- no PyQt6 -- is an
      #     error here, because the extras were installed two steps above. Any
      #     other code is an error too: a probe that starts inventing exit codes
      #     is a probe whose consumers have stopped meaning anything.
      #   * It asserts that the JSON payload and the process agree, because a
      #     report that says one thing and exits with another is the exact
      #     failure the `--json` contract exists to prevent.
      #   * It reports rather than fails when no route can make a widget. "This
      #     runner cannot show a 3-D window" is a fact about the runner, and the
      #     steps below are conditioned on it instead of being collateral.
      - name: What this runner can do with OpenGL
        id: capability
        if: ${{ !cancelled() && steps.wheelgui.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          widget=0
          raw=0
          route=none
          bad=0
          attempt() {
            label="$1"; shift
            echo "--- route: ${label}   env: $*"
            out=$(env "$@" xvfb-run -a -s "-screen 0 1280x1024x24" odgui --check 2>&1)
            rc=$?
            printf '%s\n' "$out" | tail -n 6
            echo "    -> exit ${rc}"
            case "$rc" in
              0) widget=1; route="${label}"; return 0 ;;
              4|5) raw=1; return 1 ;;
              3) echo "::error::exit 3 with PyQt6 and moderngl installed means the wheel or the extras are broken"; bad=1; return 1 ;;
              *) echo "::error::exit ${rc} is outside the documented vocabulary 0/3/4/5"; bad=1; return 1 ;;
            esac
          }
          attempt "xcb + Mesa software rasteriser" QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1
          if [ "$widget" -ne 1 ]; then
            attempt "QT_OPENGL=software" QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 QT_OPENGL=software
          fi
          if [ "$widget" -ne 1 ]; then
            attempt "xcb with the GLX integration disabled" QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 QT_XCB_GL_INTEGRATION=none
          fi
          if [ "$widget" -ne 1 ]; then
            attempt "offscreen platform" QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1
          fi
          set -e
          if [ "$bad" -ne 0 ]; then
            echo "::error::a route answered outside the documented exit vocabulary; fix the launcher or this ladder, not the expectation"
            exit 1
          fi
          # The payload/process agreement, on a route that actually ran here.
          set +e
          payload=$(env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" odgui --check --json 2>/dev/null)
          payload_rc=$?
          set -e
          echo "$payload"
          echo "$payload" | python -c "
          import json, sys
          d = json.load(sys.stdin)
          want = {'ok': 0, 'no-gui-stack': 3, 'no-context': 4, 'no-widget': 5}
          assert d['exit'] == int(sys.argv[1]), (d, sys.argv[1])
          assert want[d['verdict']] == d['exit'], d
          print('payload and process agree:', d['verdict'], d['exit'])
          " "$payload_rc"
          echo "widget=${widget}" >> "$GITHUB_OUTPUT"
          echo "raw=${raw}" >> "$GITHUB_OUTPUT"
          echo "route=${route}" >> "$GITHUB_OUTPUT"
          if [ "$widget" -eq 1 ]; then
            echo "::notice::route '${route}' realised an OpenGL widget; the windowed steps will run"
          elif [ "$raw" -eq 1 ]; then
            echo "::warning::OpenGL exists on this runner but no Qt route could put it in a widget; the windowed steps are skipped for that measured reason"
          else
            echo "::warning::no OpenGL context on this runner at all; the windowed steps are skipped for that measured reason"
          fi

      # Runs whatever the capability report concluded, and says it out loud. A
      # reader looking at a run must be able to tell "skipped because this
      # runner cannot" from "skipped because something above it broke".
      - name: What this run did and did not verify
        if: always()
        run: |
          echo "OpenGL context on this runner:    ${{ steps.capability.outputs.raw == '1' && 'yes' || 'no' }}"
          echo "Qt OpenGL widget on this runner:   ${{ steps.capability.outputs.widget == '1' && 'yes' || 'no' }}"
          echo "route that produced a widget:      ${{ steps.capability.outputs.route || 'none' }}"
          echo
          echo "Verified without a widget: the GUI-stack audit, the workbench interaction"
          echo "and framing suites, and the two shader-level smoke levels."
          echo "Verified only with a widget:       the real launch-and-close, and the"
          echo "                                   screenshots, which are framebuffer reads."
          if [ "${{ steps.capability.outputs.widget }}" != "1" ]; then
            echo "NOT verified on this runner:       the widget-dependent steps above."
            echo "                                   That is a limit of the runner, not a pass."
          fi

      # This one prints which routes obtain a context and *always* exits 0, on
      # purpose: it attributes a failure to Qt's own widget or to the product,
      # which the ladder above deliberately does not distinguish -- it only
      # decides. It is named accordingly so that a green tick here is never read
      # as "OpenGL was verified".
      - name: OpenGL route attribution (informer -- never fails)
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/qt_gl_probe.py

      # A fourth question, asked after the capability report and the route
      # attribution, and deliberately not folded into `odgui --check`'s
      # vocabulary. That vocabulary is 0/3/4/5 and all four are facts about the
      # *machine*; "the context came up and the frame is empty" is the same on
      # every machine and its cause is in the product's `paintGL`. Folding it
      # into 5 would give one code two owners, and folding it into 4 would send
      # a user to buy a graphics driver for a bug in this repository. So it is
      # its own script with its own 0/1/2, and its new state is named
      # `drew-nothing`.
      #
      # This is the one that closes the original defect. `odgui --check` used to
      # report a machine verdict for something that is a product fact, and the
      # measurement that settles it is a frame: a live context with a neutered
      # `paintGL` still has `_ctx == True` and still reports 1590x1045, while the
      # frame goes from 1111 distinct colours to 1 and from 1 593 503 non-modal
      # pixels to 0. A context handle cannot tell those apart; a frame can.
      - name: Does the viewport actually draw (measured, not inferred)
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/probe_painted_frame.py

      # Deliberately NOT conditioned on the widget capability. This suite
      # renders offscreen, and the one thing it refuses to do is call a
      # framebuffer it could not read a pass: it records that as a SKIP with the
      # reason. Conditioning it on a working widget would have re-created the
      # exact bug this job just had, where the one suite that could still say
      # something useful was the one that got cancelled.
      - name: Layout, interaction and behaviour
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/workbench_interaction_check.py

      - name: Is the structure actually centred in the viewport
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/viewport_framing_check.py

      # Two levels: the real MainWindow laid out by Qt, and the two shader
      # programs run against a standalone moderngl context with the framebuffer
      # read back. A GLSL typo, a mismatched attribute name or a wrong index
      # buffer raises here instead of silently producing a black window.
      - name: Renderer smoke, both levels
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/workbench_smoke.py

      - name: "Screenshot: contact geometry"
        if: ${{ !cancelled() && steps.capability.outcome == 'success' && steps.capability.outputs.widget == '1' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/contacts_screenshot.py

      - name: "Screenshot: pocket detection"
        if: ${{ !cancelled() && steps.capability.outcome == 'success' && steps.capability.outputs.widget == '1' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/pockets_screenshot.py

      # Published even when a step above failed, because a run whose picture was
      # never looked at is how a rendering regression survives. `ignore` on
      # purpose: on a runner with no widget there is nothing to publish, and
      # that absence is already reported by the capability report above.
      - name: Publish the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-screenshots
          path: dist/shot_*.png
          if-no-files-found: ignore

      - name: Real launch, then close
        if: ${{ !cancelled() && steps.capability.outcome == 'success' && steps.capability.outputs.widget == '1' }}
        run: |
          # A window manager is started by hand because xvfb-run does not start
          # one, and the check closes the window the way a person does. If
          # openbox is unavailable the subshell simply has no WM and the check
          # reports that it could not exercise the close path, rather than
          # failing on a missing package.
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c \
            'openbox >/dev/null 2>&1 & sleep 2; python scripts/odgui_launch_check.py'
