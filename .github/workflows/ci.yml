# The gate a pull request has to pass. Every command below was run locally on
# Windows 11 / rustc 1.98.1 / Python 3.10 before it was written here; see
# docs/VERIFICATION.md.
#
# The GUI job is best-effort on purpose, and the reason is now measured rather
# than assumed. The runner does have a working OpenGL context under
# `xvfb-run` with Mesa's software rasteriser: `odgui --check` and the context
# probe both pass there, and 45 of the 50 interaction checks pass. The five
# that do not are the ones whose truth is in the rendered pixels --
# `grabFramebuffer()` comes back uniformly coloured on a headless runner, so
# there is nothing to compare. The harness reports those as SKIP with the
# reason rather than as failures, because "this environment cannot read the
# framebuffer" and "the viewport draws nothing" are different claims and only
# one of them is true. It is still worth running: it catches import, layout
# and interaction regressions that nothing else would.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep the engine byte-reproducible across runners.
  RUSTFLAGS: "-C target-cpu=x86-64"

jobs:
  core:
    name: engine / bindings (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            cargo: ""
          - features: gpu
            cargo: "--features gpu"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dock-py/pyproject.toml') }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libegl1

      - name: Unit tests
        run: cargo test --workspace --locked ${{ matrix.cargo }}

      # Zero tolerance, in both feature configurations. The matrix already
      # covers that; a separate job would just duplicate it.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.cargo }} -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked -m dock-py/Cargo.toml --out dist ${{ matrix.cargo }}
          python -m pip install --force-reinstall dist/opendocking-*.whl

      # `--pyargs` runs the *installed* package, which is the point: it is the
      # artifact a user gets. Editing Python sources without rebuilding the
      # wheel tests the old code -- that mistake was made once already.
      - name: Python tests against the installed wheel
        run: |
          python -m pip install pytest
          python -m pytest --pyargs opendocking.tests -q

      # The step is called "entry points resolve", so that is the only thing it
      # asserts. `odgui --check` used to be a bare fourth line here, which made
      # the step unfalsifiable: this job deliberately installs no GUI extras, so
      # the check correctly answered 3 ("PyQt6 could not be imported"), and
      # `set -e` read that documented answer as a packaging failure.
      #
      # It now pins the answer this job is *supposed* to give, which is a
      # stronger claim than "did not crash": if the GUI extras ever become hard
      # dependencies, or 3 ever stops meaning "no PyQt6", this step goes red
      # and says which of the two moved.
      - name: Entry points resolve
        run: |
          odcli --version
          odcli info
          odgui --help
          set +e
          verdict=$(odgui --check --json)
          rc=$?
          set -e
          echo "$verdict"
          if [ "$rc" -ne 3 ]; then
            echo "::error::odgui --check --json exited ${rc}; this job installs no PyQt6, so 3 (no GUI stack) is the only correct answer here"
            exit 1
          fi
          # The payload and the process have to agree, not merely both exist. A
          # report that says one thing and exits with another is precisely the
          # failure this command was rewritten to stop making, so the agreement
          # is asserted here rather than assumed.
          echo "$verdict" | python -c "import json,sys; d=json.load(sys.stdin); assert d['verdict']=='no-gui-stack', d; assert d['exit']==3, d"
          echo "odgui --check answered 3, as it must on a job with no GUI extras"

      # The package ships exactly two commands: one for the viewer, one for the
      # CLI. A third entry would be a packaging mistake worth catching here.
      - name: Exactly the two documented console scripts are installed
        run: |
          actual=$(python -c "import importlib.metadata as m; print(','.join(sorted(e.name for e in m.entry_points(group='console_scripts') if 'opendocking' in (e.value or ''))))")
          echo "installed: ${actual}"
          if [ "${actual}" != "odcli,odgui" ]; then
            echo "::error::expected 'odcli,odgui' but got: ${actual}"
            exit 1
          fi

  docs:
    name: documentation hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Chinese documents are UTF-8. PowerShell 5.1 reads them as GBK and
      # silently destroys them, so their integrity is checked on every push.
      - name: Document encoding
        run: python scripts/check_doc_encoding.py

      - name: Links and local-path leakage
        run: python scripts/check_repo_docs.py

      - name: Citation metadata parses
        run: |
          python -m pip install pyyaml cffconvert
          cffconvert --validate

  gui:
    name: workbench (best effort)
    runs-on: ubuntu-latest
    # See the header: 45 of 50 interaction checks pass here, and the other five
    # are skipped because a headless runner cannot read back the framebuffer.
    # Remove this line once a runner can answer those five too.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        run: |
          sudo apt-get update
          # What the engine, the CLI and the headless GUI check need. These
          # have to be present: if one goes missing the job is reporting a
          # real environment problem.
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0 libegl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0
          # Qt 6.5 and later refuse to load the xcb platform plugin without
          # libxcb-cursor0, and say so in the log. It lives in universe, which
          # a runner image is not guaranteed to have enabled, so this group is
          # best-effort: if it is unavailable the job still runs every step
          # that does not need a real window, instead of failing on the apt
          # line before any of them execute.
          #
          # xdotool is here because the launch check needs it to *find* the
          # window: xvfb-run starts a display with no window manager, and
          # wmctrl asks the window manager for the client list, so with no WM
          # it can find nothing. xdotool walks the X tree with XQueryTree and
          # needs no WM. x11-utils gives xwininfo, the last-resort "the window
          # is there" probe.
          #
          # openbox is here because closing the window the way a person does
          # needs a window manager: wmctrl -c routes the close request through
          # one, and xdotool windowclose is not a substitute -- it destroys the
          # X window without Qt ever seeing a close event, which leaves the
          # process running with nothing on screen. A real desktop has a WM;
          # this runner did not, which is why the step kept failing.
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-xinerama0 wmctrl xdotool x11-utils openbox || \
            echo "::warning::Qt xcb extras unavailable; the windowed checks will be skipped"

      - name: Build and install the wheel with GUI extras
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked -m dock-py/Cargo.toml --out dist
          python -m pip install --force-reinstall dist/opendocking-*.whl
          python -m pip install "PyQt6>=6.4" "moderngl>=5.8"
          # RDKit is here for one assertion, and it is the most valuable one in
          # the bond check: it is the only comparison in the suite against a
          # perception written by somebody else. Installing it keeps that
          # oracle from being a thing that only runs on the maintainer's
          # machine, where a check that nobody else can run is a note, not a
          # gate. The check skips with a reason if it is ever missing.
          python -m pip install rdkit
          # Meeko is the same tool that produced the shipped examples/*.pdbqt,
          # and -- unlike this project's own reader, which is whitespace-based
          # and would accept anything -- it parses by column and rejects a
          # mis-columned line. That makes it a genuine third-party oracle for
          # the file format, and the one that would have caught the dropped
          # REMARK found this round. Its absence must be a CI failure, not a
          # silent reduction in what is checked.
          python -m pip install meeko

      # A static audit, so it needs no display and runs first: it is the check
      # that keeps the *other* GUI scripts honest. Five of them used to carry
      # their own copy of the same `odgui --check` wrapper, all parsing the first
      # line of prose as the reason -- which on a successful check is the banner,
      # not a reason. They now share one implementation that reads
      # `odgui --check --json`, and this step is what notices if a sixth copy
      # appears. Without it the convergence is a convention rather than a fact,
      # and conventions are what drift.
      - name: GUI scripts share one odgui --check wrapper
        run: python scripts/_gui_check.py

      # The name used to say "(no display needed)". It was untrue, and untrue in
      # the most instructive way: this step could only ever pass while the check
      # was *lying*. `odgui --check` asks Qt for a real OpenGL context, a
      # headless runner has none, so the honest check answered 4 -- which
      # `set -e` turned into a red job. The only reason this step had ever been
      # green was the older code path, which reported "GUI stack OK" on a
      # machine with no context at all. Giving the step a display is the fix;
      # softening the check would have put the lie back.
      #
      # 0 and 4 both pass, and the branch taken is echoed, because 4 is a fact
      # about this runner's driver rather than a defect in the package. 3 does
      # not pass: PyQt6 and moderngl were installed two steps above, so 3 would
      # mean the extras or the wheel are broken, which is ours.
      - name: GUI stack check (virtual display, software GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x1024x24" odgui --check
          rc=$?
          set -e
          case "$rc" in
            0) echo "odgui --check: the viewer obtained a context on this runner";;
            4) echo "::warning::odgui --check got no OpenGL context on this runner (exit 4). That is a fact about the runner's driver, not a packaging defect; the windowed step below is the gate that has to pass.";;
            *) echo "::error::odgui --check exited ${rc}; expected 0 (context available) or 4 (no context on this runner)"; exit 1;;
          esac

      # This one prints which routes obtain a context and *always* exits 0, on
      # purpose: it is here to attribute a future failure, not to be one. It is
      # named accordingly so that a green tick here is never read as "OpenGL
      # was verified". The step that genuinely requires a working context is
      # the windowed check below it.
      - name: OpenGL route probe (informer -- never fails)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/qt_gl_probe.py

      - name: Layout, interaction and behaviour
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/workbench_interaction_check.py

      - name: What the benchmarks report
        # pocket_benchmark.py and redock_benchmark.py are not gates and never
        # will be -- a corpus result has no ground truth, and gating it would be
        # asserting the internet. What *is* gateable is that every number each
        # one prints is the number its own line says it is, which is exactly
        # what was wrong: the pocket benchmark's "cost per 1000 atoms" was
        # milliseconds per *atom*, so a 17.6 s search over 4779 atoms printed
        # "4HHB 4 ms".
        # Offline in about a second: `urlopen` is stubbed, so no case may touch
        # the network. Deliberately gates no corpus number, and says so.
        run: python scripts/benchmark_check.py

      - name: Engine binding surface
        # 38 pytest cases covered this module, and between them they missed a
        # public property that raised AttributeError on every single call: its
        # helper was named with two leading underscores, so calling it from a
        # second class mangled it to a name that did not exist. Both pytest
        # meta-tests look at this module from outside -- one checks that wrapper
        # attributes are names the Rust extension exports, the other uses
        # hasattr and only over DockingResult -- and the defect lived in the seam
        # between two Python classes, where neither can see.
        # This one walks every public member of every wrapper on a real
        # instance and reverse-asserts that none was left unchecked.
        run: python scripts/core_check.py

      - name: Pose/receptor interaction criteria
        # No display needed, and it has to be a gate rather than a note: the
        # hydrogen-bond thresholds were once accepted as arguments and then
        # ignored, and nothing noticed until a check loosened one criterion at
        # a time and the answers did not change.
        run: python scripts/contacts_check.py

      - name: Pocket search geometry and thresholds
        # Also a gate, for the same reason. The volume ceiling and the burial
        # threshold are what stop the list reporting a protein's entire outer
        # surface as one 3564 A^3 "site", and a check that only looked at the
        # crambin result would have passed with both of them removed.
        #
        # This one docks as well as searches, so it needs the engine rather
        # than just numpy.
        run: python scripts/pockets_check.py

      - name: Bond perception and representation geometry
        run: |
          python scripts/structure_bond_check.py
          python scripts/representation_geometry_check.py

      - name: Receptor preparation reports what it dropped
        # Also a gate, and it needs no display. `prepare_receptor` keeps one
        # component of its input and discards the rest, which is usually right,
        # but until now the only record was a RuntimeWarning -- and a warning is
        # a string that GUI code and CLI code routinely drop on the floor. On
        # 1HVR, a homodimer, the redocking benchmark searched a two-chain
        # 1826-atom structure while docking against a 621-atom single chain, and
        # every RMSD it produced was meaningless. This script pins the report,
        # pins that the warning is generated *from* the report so the two cannot
        # disagree, and pins the `prepare_receptor() -> str` contract.
        run: python scripts/prep_check.py

      - name: Ligand preparation
        # `prepare_ligand` had no check at all while `prepare_receptor` had one,
        # and it is the path a first run actually goes through. It also covers
        # the two dead-and-broken paths this found: a water/ion filter that
        # called RemoveAtom on a Chem.Mol (which has no such method, so it had
        # never removed anything), and a PathToSubmol call that takes a
        # traversal path rather than a set of atoms.
        run: python scripts/ligand_check.py

      - name: odcli reports what preparation dropped
        # Runs the installed console script, not an import, because exit codes
        # and argument parsing are exactly what a CLI gets wrong.
        run: python scripts/cli_prep_check.py

      - name: The other seven odcli subcommands
        # `odcli` has eight subcommands and until now exactly one had been
        # run. Exit codes are taken from the code, not guessed -- two are
        # unintuitive: `dock` returns 2 for an empty ligand directory, and
        # `workbench` returns 3 for a missing GUI stack. Every one of the
        # eleven failure paths asserts that the diagnostic is present *and*
        # that no Python traceback is.
        # A coverage guard compares the subcommand table from `odcli --help`
        # against the set this script actually ran, demanding set equality, so
        # adding a command without a section fails the build.
        # ~21 s over 36 subprocesses; the engine time is 0.26-0.40 s per
        # docking run and the rest is interpreter cold start.
        run: python scripts/cli_check.py

      - name: The diagnostics in examples/
        # Five scripts that were not in CI, not in the reproduce list, and not
        # covered by any other check -- which makes them the only diagnostics
        # this project has, and a diagnostic nobody runs rots against a system
        # that has since changed. `diagnose_clash.py` in particular was written
        # to investigate a scoring function that no longer exists.
        # Judged on what each one *printed*, not on its exit code: a script
        # whose checks quietly stopped running still exits zero.
        run: python scripts/examples_check.py

      - name: PDBQT file format
        # A round trip through this project's own writer and reader only proves
        # they agree, and they can share a bug: `read_pdbqt_models` is a
        # MODEL/ENDMDL splitter that never reads a column, and the Rust
        # `Ligand.from_pdbqt` is whitespace-based, so it accepts a line with a
        # space deleted at column 31. Meeko parses by column and refuses that.
        # The three claims -- third-party parser, shipped third-party files,
        # own readers -- are asserted separately on purpose.
        run: python scripts/pdbqt_check.py

      - name: X11 window lookup parses each tool's real output
        # No display needed: this stubs the helpers with the formats they
        # really print. It guards the step below, which is best-effort and so
        # has never reported a check that could not find a window.
        run: python scripts/x11_window_parse_check.py

      - name: Real launch, then close
        run: |
          # A window manager is started by hand because xvfb-run does not start
          # one, and the check closes the window the way a person does. If
          # openbox is unavailable the subshell simply has no WM and the check
          # reports that it could not exercise the close path, rather than
          # failing on a missing package.
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c \
            'openbox >/dev/null 2>&1 & sleep 2; python scripts/odgui_launch_check.py'
