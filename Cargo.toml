[workspace]
resolver = "2"
members = ["dock-core", "dock-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/GrassBlock-WE/opendocking-gui"
homepage = "https://github.com/GrassBlock-WE/opendocking-gui"
authors = ["GrassBlock-WE <3365450574@qq.com>"]
description = "Open Docking (odockmcode): a modern, GPU-accelerated, open-source molecular docking engine"

[workspace.dependencies]
dock-core = { path = "dock-core", version = "0.1.0" }

# --- Numerics / geometry -------------------------------------------------
nalgebra = { version = "0.32", features = ["serde-serialize"] }
glam = { version = "0.27", features = ["serde"] }

# --- Parallelism ---------------------------------------------------------
rayon = "1.10"
rand = "0.8"
rand_pcg = "0.3"

# --- GPU compute (optional, cross-platform: Vulkan / Metal / DX12) -------
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }

# --- Serialisation / errors ---------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# --- Python bindings -----------------------------------------------------
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"

# --- Dev ----------------------------------------------------------------
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
